# Sao chép file này thành config.local.properties rồi sửa lại cho máy của bạn.
# config.local.properties đã được .gitignore, không commit.
# Chưa kết nối được? Chạy db/setup_local_sqlserver.ps1 (quyền Administrator) một lần.

db.host=localhost
db.port=1433
db.name=GymPlanner
db.user=gym_app
db.password=
db.encrypt=false
db.trustServerCertificate=true

# Mật khẩu đăng nhập ứng dụng (SHA-256 + muối), sinh bởi ứng dụng khi đổi mật khẩu
auth.salt=
auth.passwordHash=
